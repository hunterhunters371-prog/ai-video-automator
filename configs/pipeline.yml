# Configuración global del pipeline
defaults:
  language: es
  duration_target_s: 30        # 15 / 30 / 45 / 60 (o máximo de la plataforma)
  template: roblox             # plantilla por defecto si RESEARCH no elige otra
  resolution: [1080, 1920]     # 9:16 vertical
  fps: 30

stages:
  research:   { timeout_s: 300, retries: 2 }
  script:     { timeout_s: 180, retries: 3, hook_options: 5 }
  storyboard: { timeout_s: 180, retries: 2 }
  assets:     { timeout_s: 600, retries: 2 }
  voice:      { timeout_s: 300, retries: 3 }
  # ANIMATE con Wan genera un clip por línea y cada uno tarda de 1 a 5 min:
  # 6 clips pueden irse a 30 min. Con 600 s se cortaba a medias y se perdía
  # cuota ya gastada. retries: 1 a propósito — reintentar la etapa entera
  # volvería a generar clips que ya están.
  animate:    { timeout_s: 5400, retries: 1 }
  editing:    { timeout_s: 600, retries: 2 }
  rendering:  { timeout_s: 900, retries: 2 }
  qc:         { timeout_s: 300, retries: 1 }

# Clips de personaje que hablan (M2, solo plantillas con mode: historia).
#   wan   — AUTOMÁTICO. Wan (Alibaba Cloud Model Studio) por API: imagen del
#           personaje → clip. Cuota gratis de estreno: 50 s por modelo y 90
#           días en la región Singapur, o sea un episodio entero (6×8 s=48 s).
#           Después, 1080P mudo ≈ 0,0375 $/s ≈ 1,80 $ por episodio.
#           Requiere DASHSCOPE_API_KEY en .env → docs/wan-alibaba.md
#   meta  — MANUAL. Meta AI / Vibes (meta.ai): imagen → Animate → lip sync.
#   flow  — MANUAL. Google Flow: Veo 3.1 Lite, 50 créditos/día (10 por clip).
# Con meta o flow, ANIMATE pausa y escribe la guía de prompts. Las dos guías
# se escriben siempre que falte algún clip, también en modo wan, para poder
# terminar a mano si la API falla.
# El audio maestro SIEMPRE es nuestro edge-tts, así que cambiar de proveedor
# no toca el montaje.
animate:
  provider: wan
  clip_len_s: 8                # duración de referencia para las guías manuales
  wan:
    modelo: wan2.6-i2v-flash   # 2-15 s por clip, mudo con audio:false
    resolucion: 1080P          # la cuota gratis se mide en segundos, no en
                               # píxeles: a igual gasto, mejor 1080P
    prompt_extend: true        # Qwen reescribe el prompt antes de animar
    sondeo_s: 15               # intervalo recomendado por la documentación
    timeout_tarea_s: 900       # por clip
    max_clips_por_run: 0       # 0 = sin tope
    max_segundos_por_run: 0    # 0 = sin tope. Ponlo en 50 para no pasarte de
                               # la cuota gratis en la primera tanda

retry:
  backoff_base_s: 5            # backoff exponencial: 5s, 10s, 20s...

resume:
  from_last_checkpoint: true   # nunca reiniciar un proyecto desde cero

qc:
  auto_fix: true               # corregir → re-render → re-validar
  max_qc_loops: 3
  duration_tolerance_s: 1.5
  black_detect_threshold_s: 0.4
  freeze_detect_threshold_s: 2.0

storage:
  large_files: git-lfs         # renders finales y assets pesados

batch:
  max_parallel: 2              # proyectos simultáneos en un lote
  diversity:                   # matriz para que no salgan videos idénticos
    axes: [subtema, angulo, plantilla, duracion]
