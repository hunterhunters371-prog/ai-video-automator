# Configuración de voz (TTS)
provider: edge_tts             # MVP gratuito; elevenlabs / openai_tts en fases posteriores
language: es
voice: es-ES-AlvaroNeural      # alternativas: es-ES-ElviraNeural, es-MX-JorgeNeural
rate: "+8%"                    # ritmo ágil propio de Shorts
pitch: "+0Hz"
volume: "+0%"
intensity: 1.0

# Robustez: edge-tts sintetiza por websocket y ese socket puede quedarse
# esperando indefinidamente (Cloud Shell, redes con proxy).
timeout_s: 60                  # sin respuesta en este tiempo → se corta y reintenta
retries: 3                     # intentos por línea antes de fallar la etapa

# Pausas para que no suene a lectura robótica
pauses:
  comma_ms: 120
  period_ms: 250
  hook_end_ms: 400             # micro-pausa tras el hook

# Preprocesado del texto antes de sintetizar
text_preprocessing:
  numbers_to_words: true       # "2026" → "dos mil veintiséis"
  expand_acronyms: true        # "CEO" → "ce-e-o"
  normalize_punctuation: true
